<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebTrak Collector</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --good-ink: #006300;
  --fill-soft: #cde2fb; --button: #0b0b0b; --button-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --good-ink: #0ca30c;
    --fill-soft: #184f95; --button: #f0efec; --button-ink: #0b0b0b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --good-ink: #0ca30c;
  --fill-soft: #184f95; --button: #f0efec; --button-ink: #0b0b0b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 20px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
h2 { font-size: 15px; margin: 0 0 12px; font-weight: 650; }
h3 { font-size: 13px; margin: 16px 0 8px; font-weight: 600; color: var(--ink-2); }
.sub { color: var(--ink-2); }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
input, select, button { font: inherit; color: inherit; }
input[type=datetime-local], input[type=date], input[type=number], select {
  width: 100%; padding: 6px 8px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.row > div { flex: 1 1 160px; min-width: 0; }
.row > div.narrow { flex: 0 1 110px; }
.row > div.mon-pick { flex-basis: 180px; }
.row > div.go { flex: 0 0 auto; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink); margin: 0; }
button { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--axis); background: var(--surface); cursor: pointer; }
button.primary { background: var(--button); color: var(--button-ink); border-color: var(--button); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.link { border: none; background: none; padding: 2px 6px; color: var(--ink-2); text-decoration: underline; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.presets button { padding: 4px 10px; font-size: 12px; }
.plan { margin: 10px 0 12px; color: var(--ink-2); min-height: 20px; }
.warn { color: var(--critical); }
.job { border-top: 1px solid var(--grid); padding: 12px 0; }
.job:first-child { border-top: none; padding-top: 0; }
.job-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--muted); }
.dot.run { background: var(--good); } .dot.bad { background: var(--critical); } .dot.wait { background: var(--warning); }
.bar { height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; margin: 8px 0 4px; }
.bar > div { height: 100%; background: var(--s1); border-radius: 4px; transition: width .4s; }
pre { background: var(--page); border: 1px solid var(--grid); border-radius: 6px; padding: 8px; font-size: 12px;
  overflow-x: auto; margin: 8px 0 0; max-height: 220px; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 12px; margin-top: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; border-bottom: 1px solid var(--axis); padding: 6px 8px; }
td { border-bottom: 1px solid var(--grid); padding: 5px 8px; font-variant-numeric: tabular-nums; }
td.num, th.num { text-align: right; }
.scroll { overflow-x: auto; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .v { font-size: 24px; font-weight: 650; }
.tile .v small { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.tile .k { font-size: 12px; color: var(--ink-2); }
.tile .n { font-size: 11px; color: var(--muted); margin-top: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; }
.chart .hit { cursor: crosshair; }
.chart .hit:focus:not(:focus-visible) { outline: none; }
.chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; margin-bottom: 8px; }
.chart-head h2 { margin: 0; }
.zoom { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.zoom button { padding: 3px 10px; font-size: 12px; }
.zoom .muted { font-size: 12px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(0,0,0,.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 160px; display: none; z-index: 2; }
.tip b { font-size: 14px; }
.tip .t { color: var(--ink-2); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.cov { margin-bottom: 10px; }
.cov canvas { width: 100%; height: 18px; display: block; border-radius: 3px; }
.cov .axis { position: relative; height: 15px; font-size: 11px; color: var(--muted); margin-top: 2px; }
.cov .axis span { position: absolute; transform: translateX(-50%); }
.cov .axis span:first-child { transform: none; }
.cov .axis span:last-child { transform: translateX(-100%); }
.cov-title { font-size: 12px; margin-bottom: 3px; }
.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px 12px; margin-bottom: 12px; }
.section-head h2 { margin: 0; }
.section-head > div { flex: 0 1 180px; }
.job-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; margin-top: 4px; }
.job-foot details { min-width: 0; max-width: 100%; }
.job-foot details[open] { flex-basis: 100%; order: 1; }
#start-error:empty, #jobs-error:empty, #s-note:empty { display: none; }
.note { color: var(--muted); font-size: 12px; margin-top: 8px; }
.cov-note { margin: -4px 0 12px; }
#coverage { margin-top: 14px; }
.loading { opacity: .5; transition: opacity .2s; }
.empty { color: var(--muted); padding: 8px 0; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>WebTrak collector</h1>
      <div class="sub">London City Airport noise monitors · times are UK local</div>
    </div>
    <div class="sub" id="range">Checking WebTrak…</div>
  </header>

  <div class="grid2">
    <section class="card" aria-labelledby="new-h">
      <h2 id="new-h">New download</h2>
      <label>Monitors</label>
      <div class="checks" id="monitor-checks"></div>
      <div class="presets" id="presets">
        <button type="button" data-preset="last2">Latest 2 h</button>
        <button type="button" data-preset="today">Today so far</button>
        <button type="button" data-preset="yesterday">Yesterday</button>
      </div>
      <div class="row">
        <div><label for="from">From</label><input type="datetime-local" id="from"></div>
        <div><label for="to">To (not included)</label><input type="datetime-local" id="to"></div>
        <div class="narrow"><label for="delay">Seconds apart</label><input type="number" id="delay" min="0.5" step="0.5" value="2"></div>
      </div>
      <div class="plan" id="plan" aria-live="polite"></div>
      <div class="row">
        <button class="primary" id="fetch-btn" type="button">Download period</button>
        <button id="follow-btn" type="button" title="Keep collecting new data as it appears, about 25 minutes behind real time">Follow live</button>
      </div>
      <div class="plan warn" id="start-error" role="alert"></div>
    </section>

    <section class="card" aria-labelledby="jobs-h">
      <h2 id="jobs-h">Downloads</h2>
      <div class="plan warn" id="jobs-error" role="alert"></div>
      <div id="jobs"><div class="empty">No downloads started from here yet.</div></div>
    </section>
  </div>

  <section class="card" aria-labelledby="mon-h">
    <div class="section-head">
      <h2 id="mon-h">Saved data</h2>
      <div><label for="cov-day">Coverage for day</label><input type="date" id="cov-day"></div>
    </div>
    <div class="scroll"><table id="monitors"></table></div>
    <div id="coverage"></div>
  </section>

  <section aria-labelledby="stats-h">
    <div class="card">
      <h2 id="stats-h">Statistics</h2>
      <div class="row">
        <div class="narrow mon-pick"><label for="s-mon">Monitor</label><select id="s-mon"></select></div>
        <div><label for="s-from">From</label><input type="datetime-local" id="s-from" step="1"></div>
        <div><label for="s-to">To</label><input type="datetime-local" id="s-to" step="1"></div>
        <div class="narrow go"><button class="primary" id="s-go" type="button">Show</button></div>
      </div>
      <div class="plan" id="s-note"></div>
    </div>
    <div id="stats-body"></div>
  </section>
</main>

<script>
"use strict";
const ZONE = "Europe/London";

// --- small helpers ------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids) if (kid != null) n.append(kid);
  return n;
};
const svg = (tag, attrs = {}) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};
const setText = (node, text) => { if (node.textContent !== text) node.textContent = text; };
const fmt = (v, d = 1) => (v == null || Number.isNaN(v)) ? "—" : Number(v).toFixed(d);
const orDash = (v) => v == null ? "—" : String(v);
const nmtList = (ids) => `NMT${ids.join(", NMT")}`;

// Each call to a turn() returns a check that is true only while no newer turn has started,
// so a slow reply can't overwrite the answer to a later request.
const turns = () => { let n = 0; return () => { const mine = ++n; return () => mine === n; }; };

// Poll fn every ms (not while the tab is hidden, never two at once). Calling the returned
// function refreshes now; if a refresh is already running, another follows straight after it.
function every(ms, fn) {
  let timer = null, running = null, again = false;
  const run = () => {
    if (running) { again = true; return running; }
    clearTimeout(timer);
    running = (document.hidden ? Promise.resolve() : Promise.resolve().then(fn).catch(() => {})).finally(() => {
      running = null;
      if (again) { again = false; run(); } else timer = setTimeout(run, ms);
    });
    return running;
  };
  document.addEventListener("visibilitychange", () => { if (!document.hidden) run(); });
  return run;
}

// Index of the item nearest t in a list sorted by key, or -1 if it is empty.
function nearest(list, t, key) {
  let lo = 0, hi = list.length - 1;
  if (hi < 0) return -1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (key(list[mid]) < t) lo = mid + 1; else hi = mid; }
  return lo > 0 && Math.abs(key(list[lo - 1]) - t) <= Math.abs(key(list[lo]) - t) ? lo - 1 : lo;
}

// --- times: the server takes and gives London local times; the browser may be elsewhere ----
const partsFmt = new Intl.DateTimeFormat("en-GB", { timeZone: ZONE, year: "numeric", month: "2-digit", day: "2-digit",
  hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
const dayFmt = new Intl.DateTimeFormat("en-GB", { timeZone: ZONE, day: "numeric", month: "short" });
const parts = (utc) => {
  const p = {};
  for (const x of partsFmt.formatToParts(new Date(utc * 1000))) p[x.type] = x.value;
  return p;
};
const localInput = (utc) => { const p = parts(utc); return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`; };
const localInputS = (utc) => { const p = parts(utc); return `${localInput(utc)}${p.second === "00" ? "" : ":" + p.second}`; };
const localDay = (utc) => localInput(utc).slice(0, 10);
const hm = (utc) => { const p = parts(utc); return `${p.hour}:${p.minute}`; };
const hms = (utc) => { const p = parts(utc); return `${p.hour}:${p.minute}:${p.second}`; };
const dayLabel = (utc) => dayFmt.format(new Date(utc * 1000));
const dayTime = (utc) => `${dayLabel(utc)} ${hm(utc)}`;
const span = (a, b) => localDay(a) === localDay(b - 1) ? `${dayLabel(a)} ${hm(a)}–${hm(b)}` : `${dayTime(a)} – ${dayTime(b)}`;
// A period given as two input values ("2026-11-05T08:00"), the end's date only when it differs.
const inputPeriod = (from, to) => {
  const a = (from || "").replace("T", " "), b = (to || "").replace("T", " ");
  return `${a} → ${a.slice(0, 10) === b.slice(0, 10) ? b.slice(11) : b}`;
};

async function api(path, body) {
  const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

let latestUtc = null, lastStatus = null;

// --- header: WebTrak's range ------------------------------------------------------------
async function loadRange() {
  try {
    const r = await api("/api/range");
    if (r.error) throw new Error(r.error);
    latestUtc = r.latest_utc;
    $("range").textContent = `WebTrak holds ${r.first.slice(0, 10)} to ${r.last.slice(0, 16)} · newest data ${r.lag_min} min behind`;
  } catch (e) { $("range").textContent = `WebTrak not reachable: ${e.message}`; }
}

// --- new download -----------------------------------------------------------------------
const chosen = () => [...document.querySelectorAll("#monitor-checks input:checked")].map((c) => c.value);

function setPreset(name) {
  const now = latestUtc || Date.now() / 1000 - 30 * 60;
  const minute = Math.floor(now / 60) * 60;
  const [from, to] = {
    last2: [localInput(minute - 7200), localInput(minute)],
    today: [`${localDay(now)}T00:00`, localInput(minute)],
    yesterday: [`${localDay(now - 86400)}T00:00`, `${localDay(now)}T00:00`],
  }[name];
  $("from").value = from; $("to").value = to;
  planSoon();
}

let planTimer = null;
const planTurn = turns();
function planSoon() { clearTimeout(planTimer); planTimer = setTimeout(plan, 250); }
async function plan() {
  const current = planTurn();
  const ids = chosen(), from = $("from").value, to = $("to").value, out = $("plan");
  const say = (text, warn = false) => { out.textContent = text; out.classList.toggle("warn", warn); };
  $("fetch-btn").disabled = true; $("follow-btn").disabled = !ids.length;
  if (!ids.length) return say("Choose at least one monitor.");
  if (!from || !to) return say("Choose a period.");
  try {
    const p = await api(`/api/plan?${new URLSearchParams({ nmt: ids.join(","), from, to, delay: $("delay").value })}`);
    if (!current()) return;
    const txt = p.to_save === 0 ? `All ${p.chunks} chunks are already saved.`
      : `${p.chunks} chunks · ${p.to_save} to save · ${p.to_download} to download · about ${p.minutes < 1 ? "<1" : Math.round(p.minutes)} min`;
    if (p.busy.length) say(`${txt}. ${nmtList(p.busy)} is being written by another download; wait for it or stop it.`, true);
    else say(txt);
    $("fetch-btn").disabled = p.to_save === 0 || p.busy.length > 0;
    $("follow-btn").disabled = p.busy.length > 0;
  } catch (e) { if (current()) say(e.message, true); }
}

async function start(kind) {
  $("start-error").textContent = "";
  const delay = Number($("delay").value);
  const body = kind === "fetch"
    ? { kind, nmt: chosen().join(","), delay: delay || 2, from: $("from").value, to: $("to").value }
    : { kind, nmt: chosen().join(","), delay: Math.max(1, delay || 1), backfill: 1 };
  try { await api("/api/jobs", body); refreshStatus(); planSoon(); }
  catch (e) { $("start-error").textContent = e.message; }
}

// --- downloads ------------------------------------------------------------------------------
// Each job keeps its own elements and is updated in place, so an open log, a button under the
// pointer or keyboard focus survive the refresh every 2 s.
function jobState(j) {
  if (j.running) return ["run", j.kind === "follow" ? "following" : "downloading"];
  if (j.exit === 0) return ["", "finished"];
  if (j.exit === "unknown") return ["", "ended"];
  if (j.exit === 1) return ["wait", "stopped or incomplete"];
  return ["bad", `failed (exit ${j.exit})`];
}

const jobViews = new Map();

function jobAction(text, cls, fn) {
  const button = el("button", { type: "button", class: cls, text, onclick: async () => {
    button.disabled = true;
    $("jobs-error").textContent = "";
    try { await fn(); } catch (err) { $("jobs-error").textContent = `${text}: ${err.message}`; button.disabled = false; }
    refreshStatus();
  } });
  return button;
}

function makeJobView(j) {
  const v = { title: el("strong"), nmts: el("span", { class: "muted" }), dot: el("span", { class: "dot" }), state: el("span"),
    fill: el("div"), info: el("div", { class: "sub" }), log: el("pre"), actions: el("div"), running: null };
  v.bar = el("div", { class: "bar", role: "progressbar", "aria-valuemin": 0, "aria-label": "Download progress" }, v.fill);
  v.node = el("div", { class: "job" },
    el("div", { class: "job-head" }, el("div", {}, v.title, " ", v.nmts), el("span", { class: "badge" }, v.dot, v.state)),
    j.kind === "fetch" ? v.bar : null, v.info,
    el("div", { class: "job-foot" }, el("details", {}, el("summary", { text: "Log" }), v.log), v.actions));
  return v;
}

function updateJobView(v, j) {
  const [dotCls, label] = jobState(j);
  setText(v.title, j.kind === "fetch" ? inputPeriod(j.from, j.to) : `Follow live (backfill ${j.backfill} h)`);
  setText(v.nmts, nmtList(j.nmt));
  v.dot.className = `dot ${dotCls}`;
  setText(v.state, label);
  if (j.kind === "fetch") {
    const pct = j.total ? Math.min(100, 100 * j.done / j.total) : 0;
    v.fill.style.width = `${pct}%`;
    v.bar.setAttribute("aria-valuemax", j.total); v.bar.setAttribute("aria-valuenow", j.done);
    const bits = [`${j.done} of ${j.total} chunks (${Math.floor(pct)}%)`];
    if (j.running && j.per_minute) bits.push(`${fmt(j.per_minute, 0)} a minute`);
    if (j.running && j.eta_min != null) bits.push(`about ${j.eta_min < 1 ? "<1" : Math.ceil(j.eta_min)} min left`);
    setText(v.info, bits.join(" · "));
  } else {
    setText(v.info, j.last_utc ? `Newest saved data ${dayTime(j.last_utc)}, ${Math.round((Date.now() / 1000 - j.last_utc) / 60)} min ago` : "");
  }
  setText(v.log, (j.log || []).join("\n") || "(nothing yet)");
  if (v.running !== j.running) {  // the buttons only change when the job starts or ends
    v.running = j.running;
    v.actions.replaceChildren(...[
      j.kind === "fetch" ? el("button", { type: "button", class: "link", text: "Statistics", onclick: () => {
        showStats({ nmt: j.nmt[0], from: j.from, to: j.to }); $("stats-h").scrollIntoView({ behavior: "smooth" }); } }) : null,
      j.running ? jobAction("Stop", "", () => api("/api/jobs/stop", { id: j.id }))
        : jobAction("Remove", "link", () => api("/api/jobs/forget", { id: j.id }))].filter(Boolean));
  }
}

function renderJobs(jobs) {
  const box = $("jobs"), shown = jobs.slice(0, 8);
  if (!shown.length) {
    jobViews.clear();
    if (!box.querySelector(".empty")) box.replaceChildren(el("div", { class: "empty", text: "No downloads started from here yet." }));
    return;
  }
  const ids = new Set(shown.map((j) => j.id));
  for (const id of jobViews.keys()) if (!ids.has(id)) jobViews.delete(id);
  const nodes = shown.map((j) => {
    if (!jobViews.has(j.id)) jobViews.set(j.id, makeJobView(j));
    const v = jobViews.get(j.id);
    updateJobView(v, j);
    return v.node;
  });

// --- saved data ---------------------------------------------------------------------------
let monitorsKey = "";
function renderMonitors(list, jobs) {
  const appWriting = new Set(jobs.filter((j) => j.running).flatMap((j) => j.nmt));
  const key = JSON.stringify([list, [...appWriting]]);

  if (!list.length) { t.replaceChildren(el("tr", {}, el("td", { class: "empty", text: "Nothing saved yet." }))); return; }
  const head = [["Monitor"], ["Saved", true], ["From"], ["To"], ["Separate periods", true], ["Events waiting", true], ["Status"]];
  t.replaceChildren(
    el("thead", {}, el("tr", {}, ...head.map(([h, num]) => el("th", { class: num ? "num" : "", text: h })))),
    el("tbody", {}, ...list.map((m) => {
      const hours = m.chunks * 30 / 3600;
      const status = !m.writing ? "idle" : appWriting.has(m.id) ? "being written" : "being written (started outside the app)";
      return el("tr", {},
        el("td", {}, el("strong", { text: `NMT${m.id}` }), ` ${m.name}`),
        el("td", { class: "num", text: hours >= 1 ? `${fmt(hours)} h` : `${m.chunks / 2} min` }),
        el("td", { text: m.first_utc ? dayTime(m.first_utc) : "—" }),
        el("td", { text: m.last_utc ? dayTime(m.last_utc) : "—" }),
        el("td", { class: "num", text: String(m.ranges) }),
        el("td", { class: "num", text: String(m.pending_events) }),

let statusDown = false;
const refreshStatus = every(2000, async () => {
  try {
    lastStatus = await api("/api/status");
    if (statusDown) { statusDown = false; $("jobs-error").textContent = ""; }
  } catch (e) {
    statusDown = true;
    $("jobs-error").textContent = `The app isn't answering: ${e.message}`;
    return;
  }
  renderJobs(lastStatus.jobs);
  renderMonitors(lastStatus.monitors, lastStatus.jobs);
  syncStatsMonitors(lastStatus.monitors);
  // Reload the statistics when what is saved for their monitor changes (data deleted, or a
  // download from the command line), not only while the app is writing to it.
  if (!view) return;
  if (statsSavedKey === null) statsSavedKey = savedKeyFor(view.nmt);  // statistics loaded before the first status

});
// What was saved for a monitor, as of the latest status, when the statistics were last asked for.
let statsSavedKey = null;
function savedKeyFor(nmt) {
  if (!lastStatus) return null;
  const m = lastStatus.monitors.find((x) => x.id === nmt);
  return m ? `${m.chunks}|${m.ranges}|${m.first_utc}|${m.last_utc}` : "none";
}

// One bar per monitor of which half-minutes of the chosen day are saved.
let coverage = null, coverageKey = "";
const coverageTurn = turns();
const refreshCoverage = every(10000, async () => {
  const day = $("cov-day").value, current = coverageTurn();
  if (!day) return;
  const c = await api(`/api/coverage?day=${day}`);
  if (!current()) return;
  const key = JSON.stringify(c);
  if (key === coverageKey) return;
  coverageKey = key; coverage = c;
  renderCoverage();
});

function renderCoverage() {
  const c = coverage, box = $("coverage");
  if (!c) return;
  const ids = Object.keys(c.monitors);
  if (!ids.length) { box.replaceChildren(el("div", { class: "empty", text: "No monitors saved yet." })); return; }
  // Hour marks placed by the real clock, so the 23 and 25 hour clock-change days come out right.
  const length = c.end_utc - c.start_utc, marks = [];
  for (let t = c.start_utc; t <= c.end_utc; t += 3600) {
    const h = t === c.end_utc ? 24 : Number(parts(t).hour);
    if (h % 3 === 0 && !marks.some((m) => m.h === h)) marks.push({ h, left: (t - c.start_utc) / length * 100 });
  }
  box.replaceChildren(...ids.map((id) => {
    const bits = c.monitors[id], saved = bits.split("1").length - 1;
    const canvas = el("canvas", { role: "img", "aria-label": `NMT${id}: ${saved} of ${bits.length} half-minute chunks saved on ${c.day}` });
    canvas.dataset.bits = bits;
    return el("div", { class: "cov" },
      el("div", { class: "sub cov-title", text: `NMT${id} · ${fmt(saved / 120)} h of ${fmt(bits.length / 120, 0)} h saved` }),
      canvas,
      el("div", { class: "axis", "aria-hidden": "true" }, ...marks.map((m) => el("span", { style: `left:${m.left}%`, text: String(m.h).padStart(2, "0") }))));
  }));

}

function paintCoverage() {
  const css = getComputedStyle(document.documentElement), dpr = window.devicePixelRatio || 1;
  for (const canvas of $("coverage").querySelectorAll("canvas")) {
    const bits = canvas.dataset.bits, n = bits.length, w = canvas.clientWidth, h = 18;
    canvas.width = w * dpr; canvas.height = h * dpr;
    const g = canvas.getContext("2d");
    g.scale(dpr, dpr);
    g.fillStyle = css.getPropertyValue("--grid"); g.fillRect(0, 0, w, h);
    g.fillStyle = css.getPropertyValue("--s1");

      let j = bits.indexOf("0", i); if (j === -1) j = n;

      i = bits.indexOf("1", j);
    }

}

// --- statistics ---------------------------------------------------------------------------
// The period shown is `view`; the From/To boxes are only where a new one is typed. Every change

const MIN_SPAN = 60, MAX_SPAN = 31 * 86400;

function syncStatsMonitors(list) {
  const sel = $("s-mon"), ids = list.map((m) => m.id).join(",");
  if (sel.dataset.ids === ids) return;

  sel.dataset.ids = ids;

}

function showStats(next, remember = true) {
  if (remember && view && !sameView(view, next)) viewHistory.push(view);
  view = next;
  $("s-mon").value = next.nmt; $("s-from").value = next.from; $("s-to").value = next.to;
  shownKey = "";  // always draw the new view, even if its numbers match the old one
  loadStats();

function zoomTo(a, b) {

  a = Math.round(mid - len / 2); b = a + len;

function goBack() {

// About one chart point every 6 px, so zooming in shows finer detail.
function bucketFor(seconds) {
  const width = (chart.holder && chart.holder.isConnected ? chart.holder.clientWidth : $("stats-body").clientWidth - 34)
    - CHART.m.l - CHART.m.r;
  return BUCKETS.find((b) => seconds / b <= Math.max(240, width) / 6) || BUCKETS[BUCKETS.length - 1];
}

let statsTimer = null;
const statsTurn = turns();
async function loadStats() {
  clearTimeout(statsTimer);
  if (!view) return;
  const current = statsTurn(), q = view, body = $("stats-body");
  statsSavedKey = savedKeyFor(q.nmt);
  body.classList.add("loading");
  const seconds = (new Date(q.to) - new Date(q.from)) / 1000;  // the browser's zone, near enough to pick a bucket
  try {
    const s = await api(`/api/stats?${new URLSearchParams({ ...q, bucket: bucketFor(seconds > 0 ? seconds : 3600) })}`);
    if (!current()) return;
    $("s-note").textContent = "";
    history.replaceState(null, "", `?${new URLSearchParams(q)}`);
    const key = JSON.stringify(s);
    if (key !== shownKey) { shownKey = key; shown = s; renderStats(s, q); }
  } catch (e) {
    if (!current()) return;

  }

  if (lastStatus && lastStatus.monitors.some((m) => m.id === q.nmt && m.writing)) {

const chartResize = new ResizeObserver(() => { if (chart.holder && chart.holder.clientWidth !== chart.width) drawChart(); });

  if (!vals.length) { holder.replaceChildren(el("div", { class: "empty", text: "No measurements in this period." })); return; }
  const lo = Math.max(0, Math.floor((Math.min(...vals) - 3) / 10) * 10), hi = Math.ceil((Math.max(...vals) + 2) / 10) * 10;

    const c = kb == null ? (s.start + s.end) / 2 : kb;
    const zoom = { "+": 0.25, "=": 0.25, "-": 1, "_": 1 }[ev.key];
    if (zoom) { ev.preventDefault(); chart.refocus = true; zoomTo(c - len * zoom, c + len * zoom); return; }
    if (ev.key === "Backspace" && viewHistory.length) { ev.preventDefault(); chart.refocus = true; goBack(); return; }
    if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
    ev.preventDefault();
    kb = Math.min(s.end, Math.max(s.start, (kb == null ? s.start : kb) + (ev.key === "ArrowRight" ? 1 : -1) * s.bucket_s));
    show(kb);
  });
}

// --- start --------------------------------------------------------------------------------
async function init() {
  const monitors = await api("/api/monitors");
  $("monitor-checks").replaceChildren(...monitors.map((m) => el("label", {},
    el("input", { type: "checkbox", value: m.id, checked: m.id === "106", onchange: planSoon }), `NMT${m.id} ${m.name}`)));
  let periodChosen = false;  // once the person picks a period, the late WebTrak range mustn't replace it
  $("presets").addEventListener("click", (e) => {
    const b = e.target.closest("[data-preset]");
    if (b) { periodChosen = true; setPreset(b.dataset.preset); }
  });
  for (const id of ["from", "to", "delay"]) $(id).addEventListener("input", () => { if (id !== "delay") periodChosen = true; planSoon(); });
  $("fetch-btn").addEventListener("click", () => start("fetch"));
  $("follow-btn").addEventListener("click", () => start("follow"));
  $("s-go").addEventListener("click", () => {
    const next = { nmt: $("s-mon").value, from: $("s-from").value, to: $("s-to").value };
    if (!next.nmt || !next.from || !next.to) { $("s-note").textContent = "Choose a monitor and a period."; return; }
    showStats(next);
  });
  $("cov-day").addEventListener("change", () => { coverageKey = ""; refreshCoverage(); });
  new ResizeObserver(paintCoverage).observe($("coverage"));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintCoverage);

  // WebTrak's range comes over the network and can take seconds: show the local data without
  // waiting for it, guessing WebTrak's usual delay until it arrives.
  setPreset("last2");
  $("cov-day").value = localDay(Date.now() / 1000 - 30 * 60);
  loadRange().then(() => { if (!periodChosen) setPreset("last2"); });
  await refreshStatus();
  refreshCoverage();
  setInterval(loadRange, 300000);

  // Statistics start on the period in the address, else the newest download, else the latest 2 hours saved.
  const want = new URLSearchParams(location.search);
  const lastFetch = lastStatus && lastStatus.jobs.find((j) => j.kind === "fetch");
  const firstMon = lastStatus && lastStatus.monitors[0];
  let first = null;
  if (want.get("from") && want.get("to")) first = { nmt: want.get("nmt") || "106", from: want.get("from"), to: want.get("to") };
  else if (lastFetch) first = { nmt: lastFetch.nmt[0], from: lastFetch.from, to: lastFetch.to };
  else if (firstMon && firstMon.last_utc) first = { nmt: firstMon.id, from: localInput(firstMon.last_utc - 7200), to: localInput(firstMon.last_utc) };
  if (first) showStats(first, false);
}

init().catch((e) => {
  // Opened as a plain file, or from a server that isn't the app's: there is no /api to talk to.
  const hint = location.protocol === "file:" || /HTTP 404|Failed to fetch|NetworkError/.test(e.message)
    ? " This page needs the app's own server: run  python3 -m webtrak serve  in tools/webtrak, then open http://127.0.0.1:8765/" : "";
  document.querySelector("main").prepend(el("div", { class: "card warn", text: `Couldn't start: ${e.message}.${hint}` }));
});
</script>
</body>
